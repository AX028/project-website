services:
  - type: web
    name: project-simulation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 30 app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: CACHE_TTL_SECONDS
        value: 600
      - key: SMTP_USE_TLS
        value: true
      - key: CONTACT_RECIPIENT
        sync: false
      - key: CONTACT_SENDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false

