[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "project-website"
version = "1.0.0"
description = "Portfolio and project hub for Project Simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "Flask-Limiter>=3.8,<5",
  "Flask-WTF>=1.2,<2",
  "gunicorn>=22,<24; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["project_website"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["project_website"]

[[tool.mypy.overrides]]
module = ["flask_limiter", "flask_limiter.*", "flask_wtf", "flask_wtf.*", "wtforms", "wtforms.*"]
ignore_missing_imports = true

